    <script>
        'use strict';

        var FINE_POINTER = window.matchMedia('(pointer: fine)').matches;
        var REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        /* ===== Custom cursor: dot follows instantly, ring lerps behind ===== */
        (function initCursor() {
            if (!FINE_POINTER || REDUCED_MOTION) return;
            var dot = document.getElementById('cursor-dot');
            var ring = document.getElementById('cursor-ring');
            document.body.classList.add('has-cursor');

            var mx = window.innerWidth / 2, my = window.innerHeight / 2;
            var rx = mx, ry = my;
            var scale = 1, targetScale = 1;
            var hovering = false;

            document.addEventListener('mousemove', function (e) {
                mx = e.clientX;
                my = e.clientY;
                if (!document.body.classList.contains('cursor-live')) {
                    document.body.classList.add('cursor-live');
                }
            });

            document.addEventListener('mousedown', function () { targetScale = 0.75; });
            document.addEventListener('mouseup', function () { targetScale = hovering ? 1.5 : 1; });

            document.addEventListener('mouseover', function (e) {
                if (e.target.closest && e.target.closest('a, button, input')) {
                    hovering = true;
                    targetScale = 1.5;
                }
            });
            document.addEventListener('mouseout', function (e) {
                var link = e.target.closest ? e.target.closest('a, button, input') : null;
                if (link && !(e.relatedTarget && link.contains(e.relatedTarget))) {
                    hovering = false;
                    targetScale = 1;
                }
            });

            (function loop() {
                rx += (mx - rx) * 0.16;
                ry += (my - ry) * 0.16;
                scale += (targetScale - scale) * 0.25;
                dot.style.transform = 'translate3d(' + mx + 'px,' + my + 'px,0) translate(-50%,-50%)';
                ring.style.transform = 'translate3d(' + rx + 'px,' + ry + 'px,0) translate(-50%,-50%) scale(' + scale + ')';
                requestAnimationFrame(loop);
            })();
        })();

        /* ===== Floating particles (fewer, no shadows, transform-only) ===== */
        (function initParticles() {
            if (REDUCED_MOTION) return;
            var isMobile = window.matchMedia('(max-width: 480px)').matches;
            var count = isMobile ? 6 : 12;
            var container = document.getElementById('particles');
            var frag = document.createDocumentFragment();
            for (var i = 0; i < count; i++) {
                var p = document.createElement('span');
                p.className = 'particle';
                var size = (Math.random() * 3 + 2).toFixed(1);
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = (Math.random() * 100) + '%';
                p.style.top = (20 + Math.random() * 80) + '%';
                p.style.animationDuration = (Math.random() * 6 + 7).toFixed(1) + 's';
                p.style.animationDelay = (-Math.random() * 8).toFixed(1) + 's';
                frag.appendChild(p);
            }
            container.appendChild(frag);
        })();

        /* ===== Clock ===== */
        function updateClock() {
            var now = new Date();
            var time = [now.getHours(), now.getMinutes(), now.getSeconds()]
                .map(function (n) { return String(n).padStart(2, '0'); })
                .join(':');
            var hari = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            var bulan = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            var timeEl = document.getElementById('time');
            var dateEl = document.getElementById('date');
            if (timeEl) timeEl.textContent = time;
            if (dateEl) dateEl.textContent = hari[now.getDay()] + ', ' + now.getDate() + ' ' + bulan[now.getMonth()] + ' ' + now.getFullYear();
        }
        setInterval(updateClock, 1000);
        updateClock();

        /* ===== Typing effect ===== */
        (function initTyping() {
            var taglines = ['WhatsApp Bot Developer', 'Content Creator', 'Tech Enthusiast'];
            var el = document.getElementById('typing-text');
            if (REDUCED_MOTION) {
                el.textContent = taglines[0];
                return;
            }
            var tagIndex = 0, charIndex = 0, deleting = false;
            function tick() {
                var current = taglines[tagIndex];
                if (deleting) {
                    charIndex--;
                    el.textContent = current.substring(0, charIndex);
                } else {
                    charIndex++;
                    el.textContent = current.substring(0, charIndex);
                }
                var speed = deleting ? 45 : 95;
                if (!deleting && charIndex === current.length) {
                    speed = 2000;
                    deleting = true;
                } else if (deleting && charIndex === 0) {
                    deleting = false;
                    tagIndex = (tagIndex + 1) % taglines.length;
                    speed = 450;
                }
                setTimeout(tick, speed);
            }
            tick();
        })();

        /* ===== Theme toggle + theme-color sync ===== */
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            try { localStorage.setItem('theme', theme); } catch (e) {}
            var meta = document.getElementById('meta-theme-color');
            if (meta) meta.setAttribute('content', theme === 'dark' ? '#050510' : '#eef2fd');
        }

        document.getElementById('theme-toggle').addEventListener('click', function () {
            var current = document.documentElement.getAttribute('data-theme');
            setTheme(current === 'dark' ? 'light' : 'dark');
        });

        /* ===== Toast ===== */
        var toastTimer = null;
        function toast(msg) {
            var t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
        }

        /* ===== Share (toast fallback, no alert) ===== */
        function copyLink(data) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(data.text + '\n' + data.url)
                    .then(function () { toast('Link disalin ke clipboard!'); })
                    .catch(function () { toast('Gagal menyalin link.'); });
            } else {
                toast('Bagikan manual: ' + data.url);
            }
        }
        document.getElementById('share-button').addEventListener('click', function () {
            var data = {
                title: document.title,
                text: 'Kunjungi portfolio DimasAjaa - WhatsApp Bot Developer & Content Creator!',
                url: window.location.href
            };
            if (navigator.share) {
                navigator.share(data).catch(function (err) {
                    // If share failed for a real reason (not user cancel), fall back to clipboard
                    if (err && err.name !== 'AbortError') copyLink(data);
                });
            } else {
                copyLink(data);
            }
        });

        /* ===== Ripple: real diameter from click position ===== */
        document.querySelectorAll('.link-card').forEach(function (card) {
            card.addEventListener('pointerdown', function (e) {
                var rect = card.getBoundingClientRect();
                var diameter = Math.max(rect.width, rect.height) * 2;
                var ripple = document.createElement('span');
                ripple.className = 'ripple';
                ripple.style.width = diameter + 'px';
                ripple.style.height = diameter + 'px';
                ripple.style.left = (e.clientX - rect.left - diameter / 2) + 'px';
                ripple.style.top = (e.clientY - rect.top - diameter / 2) + 'px';
                card.appendChild(ripple);
                setTimeout(function () { ripple.remove(); }, 650);
            });
        });
    </script>
