<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DimasAjaa | Chat AI</title>

    <meta name="description" content="Chat AI DimasAjaa - Tanya apa saja ke chatbot AI powered by Botika.">
    <meta name="theme-color" content="#0f172a">
    <meta property="og:title" content="DimasAjaa | Chat AI">
    <meta property="og:description" content="Chat dengan AI langsung dari website DimasAjaa.">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <!-- Custom Cursor -->
    <div id="cursor-dot"></div>
    <div id="cursor-ring"></div>

    <!-- Floating Particles -->
    <div id="particles"></div>

    <!-- Theme Toggle -->
    <button id="theme-toggle" aria-label="Ganti tema" onclick="toggleTheme()">
        <i data-feather="sun" class="feather-sun"></i>
        <i data-feather="moon" class="feather-moon"></i>
    </button>

    <!-- Chat Container -->
    <div id="chat-wrapper">
        <!-- Chat Header -->
        <div id="chat-header">
            <a href="/" id="back-button">
                <i data-feather="arrow-left"></i>
            </a>
            <div id="chat-header-info">
                <h1>Chat AI</h1>
                <p>Powered by Botika</p>
            </div>
        </div>

        <!-- Chat Messages Area -->
        <div id="chat-messages"></div>

        <!-- Chat Input Area -->
        <div id="chat-input-area">
            <form id="chat-form">
                <input type="text" id="chat-input" placeholder="Ketik pesan..." autocomplete="off">
                <button type="submit" id="send-button">
                    <i data-feather="send"></i>
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script>
        // Initialize Feather Icons
        feather.replace();

        // ===== Custom Cursor =====
        const cursorDot = document.getElementById('cursor-dot');
        const cursorRing = document.getElementById('cursor-ring');

        document.addEventListener('mousemove', (e) => {
            cursorDot.style.left = e.clientX + 'px';
            cursorDot.style.top = e.clientY + 'px';
            cursorRing.style.left = e.clientX + 'px';
            cursorRing.style.top = e.clientY + 'px';
        });

        document.addEventListener('mousedown', () => {
            cursorRing.style.transform = 'translate(-50%, -50%) scale(0.8)';
        });

        document.addEventListener('mouseup', () => {
            cursorRing.style.transform = 'translate(-50%, -50%) scale(1)';
        });

        // ===== Floating Particles =====
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 6 + 's';
            particle.style.animationDuration = (Math.random() * 4 + 4) + 's';
            particle.style.width = particle.style.height = (Math.random() * 4 + 2) + 'px';
            particlesContainer.appendChild(particle);
        }

        // ===== Theme Toggle =====
        function toggleTheme() {
            const html = document.documentElement;
            const newTheme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        const storedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', storedTheme);

        // ===== Chat Logic =====
        const chatMessages = document.getElementById('chat-messages');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const sendButton = document.getElementById('send-button');

        // Generate persistent sender ID
        let senderId = localStorage.getItem('chat-sender-id');
        if (!senderId) {
            senderId = 'user-' + Date.now() + '-' + Math.random().toString(36).substring(2, 8);
            localStorage.setItem('chat-sender-id', senderId);
        }

        // Welcome message
        function addWelcomeMessage() {
            addMessage('bot', 'Halo! Saya Chat AI dari Botika. Ada yang bisa saya bantu?');
        }

        // Add message to chat
        function addMessage(role, text) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', `message--${role}`);

            const bubble = document.createElement('div');
            bubble.classList.add('message-bubble');
            bubble.textContent = text;

            const timeSpan = document.createElement('span');
            timeSpan.classList.add('message-time');
            const now = new Date();
            timeSpan.textContent = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

            messageDiv.appendChild(bubble);
            messageDiv.appendChild(timeSpan);
            chatMessages.appendChild(messageDiv);
            scrollToBottom();
        }

        // Loading indicator
        function addLoadingIndicator() {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', 'message--bot', 'message--typing');
            messageDiv.id = 'typing-indicator';

            const bubble = document.createElement('div');
            bubble.classList.add('message-bubble');
            for (let i = 0; i < 3; i++) {
                const dot = document.createElement('div');
                dot.classList.add('typing-dot');
                bubble.appendChild(dot);
            }

            messageDiv.appendChild(bubble);
            chatMessages.appendChild(messageDiv);
            scrollToBottom();
            return messageDiv;
        }

        function removeLoadingIndicator(el) {
            if (el && el.parentNode) {
                el.parentNode.removeChild(el);
            }
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Form submit
        chatForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (!text) return;

            chatInput.value = '';
            sendButton.disabled = true;
            addMessage('user', text);

            const loadingEl = addLoadingIndicator();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, senderId: senderId })
                });

                const data = await response.json();
                removeLoadingIndicator(loadingEl);

                if (data.reply) {
                    addMessage('bot', data.reply);
                } else {
                    addMessage('bot', 'Maaf, terjadi kesalahan. Coba lagi nanti.');
                }
            } catch (err) {
                removeLoadingIndicator(loadingEl);
                addMessage('bot', 'Maaf, koneksi gagal. Periksa internet kamu.');
            }

            sendButton.disabled = false;
            chatInput.focus();
        });

        // Initialize
        addWelcomeMessage();
        chatInput.focus();
    </script>
</body>
</html>
