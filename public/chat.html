<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DimasAjaa | Chat AI</title>

    <meta name="description" content="Chat dengan Rimuruassistant - AI chatbot by DimasAjaa.">
    <meta name="theme-color" content="#0f172a">
    <meta property="og:title" content="DimasAjaa | Rimuruassistant">
    <meta property="og:description" content="Chat dengan Rimuruassistant, asisten AI dari DimasAjaa.">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="chat-page">
    <!-- Floating Particles -->
    <div id="particles"></div>

    <!-- Chat Container -->
    <div id="chat-wrapper">
        <!-- Chat Header -->
        <div id="chat-header">
            <a href="/" id="back-button">
                <i data-feather="arrow-left"></i>
            </a>
            <div id="chat-avatar-wrap">
                <img src="https://i.pinimg.com/736x/a6/bc/dd/a6bcddca2a67b35411717699861b6db1.jpg" alt="Rimuruassistant" id="chat-avatar">
                <span id="online-dot"></span>
            </div>
            <div id="chat-header-info">
                <h1>Rimuruassistant</h1>
                <p>AI Assistant <span class="header-separator">|</span> <span class="header-status">Online</span></p>
            </div>
        </div>

        <!-- Chat Messages Area -->
        <div id="chat-messages"></div>

        <!-- Chat Input Area -->
        <div id="chat-input-area">
            <form id="chat-form">
                <input type="text" id="chat-input" placeholder="Ketik pesan..." autocomplete="off">
                <button type="submit" id="send-button">
                    <i data-feather="send"></i>
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script>
        // Initialize Feather Icons
        feather.replace();

        // ===== Floating Particles (optimized) =====
        const particlesContainer = document.getElementById('particles');
        const isMobile = window.matchMedia('(max-width: 480px)').matches;
        const particleCount = isMobile ? 0 : 15;
        if (particleCount > 0) {
            const fragment = document.createDocumentFragment();
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 4 + 4) + 's';
                particle.style.width = particle.style.height = (Math.random() * 4 + 2) + 'px';
                fragment.appendChild(particle);
            }
            particlesContainer.appendChild(fragment);
        }

        // ===== Theme Sync =====
        const storedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', storedTheme);

        // ===== Chat Logic =====
        const chatMessages = document.getElementById('chat-messages');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const sendButton = document.getElementById('send-button');
        const CHAT_HISTORY_KEY = 'chat-history';
        const MAX_HISTORY = 50;

        // Generate persistent sender ID
        let senderId = localStorage.getItem('chat-sender-id');
        if (!senderId) {
            senderId = 'user-' + Date.now() + '-' + Math.random().toString(36).substring(2, 8);
            localStorage.setItem('chat-sender-id', senderId);
        }

        // Load chat history
        function loadHistory() {
            try {
                return JSON.parse(localStorage.getItem(CHAT_HISTORY_KEY)) || [];
            } catch { return []; }
        }

        // Save chat history
        function saveHistory() {
            const messages = [];
            chatMessages.querySelectorAll('.message').forEach(el => {
                const role = el.classList.contains('message--user') ? 'user' : 'bot';
                const text = el.querySelector('.message-bubble')?.textContent || '';
                const time = el.querySelector('.message-time')?.textContent || '';
                messages.push({ role, text, time });
            });
            const trimmed = messages.slice(-MAX_HISTORY);
            localStorage.setItem(CHAT_HISTORY_KEY, JSON.stringify(trimmed));
        }

        // Add message to chat
        function addMessage(role, text, time) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', `message--${role}`);

            const bubble = document.createElement('div');
            bubble.classList.add('message-bubble');
            bubble.textContent = text;

            const timeSpan = document.createElement('span');
            timeSpan.classList.add('message-time');
            if (time) {
                timeSpan.textContent = time;
            } else {
                const now = new Date();
                timeSpan.textContent = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
            }

            messageDiv.appendChild(bubble);
            messageDiv.appendChild(timeSpan);
            chatMessages.appendChild(messageDiv);
            scrollToBottom();
        }

        // Loading indicator
        function addLoadingIndicator() {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', 'message--bot', 'message--typing');
            messageDiv.id = 'typing-indicator';

            const bubble = document.createElement('div');
            bubble.classList.add('message-bubble');
            for (let i = 0; i < 3; i++) {
                const dot = document.createElement('div');
                dot.classList.add('typing-dot');
                bubble.appendChild(dot);
            }

            messageDiv.appendChild(bubble);
            chatMessages.appendChild(messageDiv);
            scrollToBottom();
            return messageDiv;
        }

        function removeLoadingIndicator(el) {
            if (el && el.parentNode) {
                el.parentNode.removeChild(el);
            }
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Form submit
        chatForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (!text) return;

            chatInput.value = '';
            sendButton.disabled = true;
            addMessage('user', text);

            const loadingEl = addLoadingIndicator();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, senderId: senderId })
                });

                const data = await response.json();
                removeLoadingIndicator(loadingEl);

                if (response.status === 429) {
                    addMessage('bot', data.error || 'Terlalu banyak pesan. Tunggu sebentar ya.');
                } else if (data.reply) {
                    addMessage('bot', data.reply);
                } else {
                    addMessage('bot', 'Maaf, terjadi kesalahan. Coba lagi nanti.');
                }
                saveHistory();
            } catch (err) {
                removeLoadingIndicator(loadingEl);
                addMessage('bot', 'Maaf, koneksi gagal. Periksa internet kamu.');
                saveHistory();
            }

            sendButton.disabled = false;
            chatInput.focus();
        });

        // Initialize: load history or show welcome
        const history = loadHistory();
        if (history.length > 0) {
            history.forEach(msg => addMessage(msg.role, msg.text, msg.time));
        } else {
            addMessage('bot', 'Halo! Saya Rimuruassistant, asisten AI dari Dimas. Ada yang bisa saya bantu?');
        }
        chatInput.focus();
    </script>
</body>
</html>
